<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ashealth — AS運用の健康診断</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --ink: #1f2933; --muted: #6b7683;
    --ok: #1a7f37; --info: #0969da; --warn: #9a6700; --fail: #cf222e;
    --line: #d8dee4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  h1 .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .tagline { color: var(--muted); margin: 0 0 1.5rem; font-size: .95rem; }
  form { display: flex; gap: .6rem; margin-bottom: 1.75rem; }
  input[type=text] {
    flex: 1; padding: .65rem .9rem; font-size: 1.05rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    font-family: ui-monospace, Menlo, monospace;
  }
  input[type=text]:focus { outline: 2px solid #0969da55; border-color: #0969da; }
  button {
    padding: .65rem 1.4rem; font-size: 1rem; font-weight: 600; cursor: pointer;
    border: none; border-radius: 8px; background: #24292f; color: #fff;
  }
  button:disabled { opacity: .55; cursor: wait; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: -1.25rem; margin-bottom: 1.5rem; }
  .hint code { background: #eef1f4; padding: .1rem .35rem; border-radius: 4px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.25rem 1.5rem; margin-bottom: 1rem;
  }
  #status { color: var(--muted); }
  .error { color: var(--fail); font-weight: 600; }
  .scorebox { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
  .scorenum { font-size: 3.4rem; font-weight: 800; line-height: 1; }
  .scorenum small { font-size: 1.1rem; font-weight: 500; color: var(--muted); }
  .gradechip {
    font-size: 1.6rem; font-weight: 800; color: #fff;
    width: 3.2rem; height: 3.2rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .g-A, .g-B { background: var(--ok); } .g-C { background: var(--warn); }
  .g-D, .g-E { background: var(--fail); }
  .c-A, .c-B { color: var(--ok); } .c-C { color: var(--warn); }
  .c-D, .c-E { color: var(--fail); }
  .meta { color: var(--muted); font-size: .9rem; }
  .sec-title { font-weight: 700; margin: 1.1rem 0 .35rem; font-size: .95rem; }
  .finding { display: flex; gap: .6rem; padding: .25rem 0; font-size: .92rem; align-items: baseline; }
  .tag {
    font-family: ui-monospace, Menlo, monospace; font-size: .72rem; font-weight: 700;
    padding: .1rem .45rem; border-radius: 4px; color: #fff; flex: none; min-width: 3.2rem; text-align: center;
  }
  .t-OK { background: var(--ok); } .t-INFO { background: var(--info); }
  .t-WARN { background: var(--warn); } .t-FAIL { background: var(--fail); }
  .subject { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  ol.actions { padding-left: 1.4rem; margin: .4rem 0 0; }
  ol.actions li { margin-bottom: .4rem; font-size: .92rem; }
  ul.deductions { list-style: none; padding: 0; margin: .4rem 0 0; font-size: .9rem; }
  ul.deductions li { padding: .1rem 0; }
  .points { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--fail); }
  .note { color: var(--muted); font-size: .82rem; margin-top: .75rem; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 2rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1><span class="mono">ashealth</span> — AS運用の健康診断</h1>
  <p class="tagline">BGP広報 / RPKI ROA / IRR / PeeringDB のズレを検出し、修正アクションを提示します</p>

  <form id="form">
    <input type="text" id="asn" placeholder="AS番号を入力 (例: 64500)" autocomplete="off" autofocus>
    <button type="submit" id="btn">診断する</button>
  </form>
  <p class="hint">ヒント: <code>64500</code> を入力するとオフラインのデモデータで診断結果を確認できます</p>

  <div id="status" class="card hidden"></div>
  <div id="result" class="hidden">
    <div class="card">
      <div class="scorebox">
        <div class="scorenum" id="score"></div>
        <div class="gradechip" id="grade"></div>
        <div>
          <div id="target" style="font-weight:700"></div>
          <div class="meta" id="meta"></div>
          <div class="meta" id="comment"></div>
        </div>
      </div>
    </div>
    <div class="card" id="sections"></div>
    <div class="card" id="deductions-card">
      <div class="sec-title" style="margin-top:0">減点内訳</div>
      <ul class="deductions" id="deductions"></ul>
    </div>
    <div class="card" id="actions-card">
      <div class="sec-title" style="margin-top:0">修正アクション (優先度順)</div>
      <ol class="actions" id="actions"></ol>
    </div>
    <div id="notes"></div>
  </div>

  <footer>データソース: RIPEstat Data API / PeeringDB / whois.radb.net — ashealth</footer>
</main>

<script>
const SECTIONS = {
  1: "ROAカバレッジ", 2: "RPKI検証", 3: "未使用ROA",
  4: "IRR登録", 5: "IRR陳腐化", 6: "IRR origin整合性", 7: "PeeringDB登録"
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const asn = $("asn").value.trim();
  if (!asn) return;
  $("btn").disabled = true;
  $("result").classList.add("hidden");
  $("status").classList.remove("hidden");
  $("status").innerHTML = "AS" + esc(asn.replace(/^as/i, "")) +
    " を診断中… (RPKI検証のため数十秒かかることがあります)";
  try {
    const resp = await fetch("/api/check/" + encodeURIComponent(asn));
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));
    render(data);
    $("status").classList.add("hidden");
    $("result").classList.remove("hidden");
  } catch (err) {
    $("status").innerHTML = '<span class="error">診断に失敗しました:</span> ' + esc(err.message);
  } finally {
    $("btn").disabled = false;
  }
});

function render(r) {
  $("score").innerHTML = esc(r.score) + '<small> / 100</small>';
  $("score").className = "scorenum c-" + r.grade;
  $("grade").textContent = r.grade;
  $("grade").className = "gradechip g-" + r.grade;
  $("target").textContent = "AS" + r.asn + " (" + r.holder + ")";
  let meta = "広報 " + r.announced_count + " prefixes (IPv4 " + r.ipv4_count +
    " / IPv6 " + r.ipv6_count + ") · RPKI検証 " + r.rpki_checked + "件";
  if (r.irr_route_count != null) meta += " · IRR " + r.irr_route_count + "件";
  $("meta").textContent = meta;
  $("comment").textContent = r.grade_comment;

  let html = "";
  for (const no of [1, 2, 3, 4, 5, 6, 7]) {
    const items = r.findings.filter(f => f.check_no === no);
    html += '<div class="sec-title">[' + no + '] ' + esc(SECTIONS[no]) + '</div>';
    if (!items.length) {
      html += '<div class="finding meta">(データ取得失敗のためスキップ)</div>';
      continue;
    }
    for (const f of items) {
      html += '<div class="finding"><span class="tag t-' + esc(f.severity) + '">' +
        esc(f.severity) + '</span><span>' +
        (f.subject ? '<span class="subject">' + esc(f.subject) + '</span> — ' : '') +
        esc(f.message) + '</span></div>';
    }
  }
  $("sections").innerHTML = html;

  $("deductions-card").classList.toggle("hidden", !r.deductions.length);
  $("deductions").innerHTML = r.deductions.map(d =>
    '<li><span class="points">-' + esc(d.points) + '</span> ' +
    esc(d.label) + ' × ' + esc(d.count) + '件</li>').join("");

  $("actions-card").classList.toggle("hidden", !r.fix_actions.length);
  $("actions").innerHTML = r.fix_actions.map(a => "<li>" + esc(a) + "</li>").join("");

  $("notes").innerHTML = (r.notes || []).map(n =>
    '<div class="note">※ ' + esc(n) + "</div>").join("");
}
</script>
</body>
</html>
